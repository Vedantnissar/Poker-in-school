<!doctype html>
<html lang="en" style="background:#161512">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>200 Club</title>
<meta name="description" content="Hold’em for friends. 200 chips to sit down.">
<meta name="theme-color" content="#161512">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #161512;
  --nav: #1e1d1a;
  --panel: #262421;
  --panel-2: #2f2d2a;
  --panel-3: #3b3936;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .14);
  --ink: #f3f2ee;
  --muted: #a3a19c;
  --dim: #75736f;
  --green: #81b64c;
  --green-hi: #95c860;
  --green-edge: #4c7a32;
  --green-text: #9fd067;
  --red: #e0513c;
  --red-text: #f07a66;
  --felt: #3a6a30;
  --felt-hi: #487d3c;
  --felt-lo: #2a5024;
  --rail: #0f0e0c;
  --card: #fbfaf5;
  --card-ink: #1b1b1b;
  --card-red: #d02d2d;
  --back: #2b4f25;
  --shade: rgba(0, 0, 0, .62);
  --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --nav-w: 208px;
  --side-w: 330px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
#app { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.up { color: var(--green-text); }
.down { color: var(--red-text); }
kbd {
  font: 700 11px/1 var(--font); padding: 3px 5px; border-radius: 4px;
  background: rgba(0, 0, 0, .22); color: inherit; opacity: .8; margin-left: 2px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px;
  font-weight: 800; font-size: 16px; white-space: nowrap; color: var(--ink);
  background: var(--panel-3); box-shadow: 0 4px 0 0 #1c1b19;
  transition: background-color .12s ease, transform .06s ease, box-shadow .06s ease;
}
.btn:hover:not(:disabled) { background: #46443f; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 0 #1c1b19; }
.btn:disabled { opacity: .45; }
.btn.go { background: var(--green); color: #fff; box-shadow: 0 4px 0 0 var(--green-edge); text-shadow: 0 1px 0 rgba(0,0,0,.18); }
.btn.go:hover:not(:disabled) { background: var(--green-hi); }
.btn.go:active:not(:disabled) { box-shadow: 0 2px 0 0 var(--green-edge); }
.btn.big { min-height: 60px; font-size: 21px; border-radius: 10px; padding: 0 26px; }
.btn.small { min-height: 34px; font-size: 14px; padding: 0 12px; border-radius: 6px; box-shadow: 0 3px 0 0 #1c1b19; }
.btn.flat { background: transparent; box-shadow: none; color: var(--muted); font-weight: 700; }
.btn.flat:hover:not(:disabled) { background: var(--panel-2); color: var(--ink); }
.linkish { background: none; border: 0; padding: 2px; color: var(--green-text); font-weight: 700; }
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- shell ---------- */
.shell { display: flex; height: 100%; }
.nav {
  width: var(--nav-w); flex: none; background: var(--nav); display: flex; flex-direction: column;
  padding: 14px 10px; gap: 4px; border-right: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; color: var(--ink); text-decoration: none; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: var(--green); box-shadow: 0 3px 0 0 var(--green-edge); color: #fff; font-size: 20px; line-height: 1;
}
.logo b { font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
.logo b span { color: var(--green-text); }
.nav a.item, .nav button.item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px;
  color: var(--muted); text-decoration: none; font-weight: 700; font-size: 16px; background: none; border: 0; width: 100%; text-align: left;
}
.nav .item svg { width: 22px; height: 22px; flex: none; }
.nav .item:hover { background: var(--panel); color: var(--ink); }
.nav .item.on { background: var(--panel-2); color: var(--ink); }
.nav .item.on svg { color: var(--green-text); }
.nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.me-chip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: none; border: 0; width: 100%; text-align: left; }
.me-chip:hover { background: var(--panel); }
.me-chip span { min-width: 0; }
.me-chip b { display: block; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-chip small { display: block; color: var(--muted); font-size: 13px; }
.main { flex: 1; min-width: 0; overflow-y: auto; }
body.on-table .main { overflow: hidden; }
.avatar {
  --c: #5b7a46; width: 36px; height: 36px; border-radius: 7px; flex: none;
  display: grid; place-items: center; background: var(--c); color: #fff;
  font-weight: 900; font-size: 15px; letter-spacing: -.02em; text-transform: uppercase;
}
.avatar.sm { width: 26px; height: 26px; font-size: 12px; border-radius: 5px; }

/* ---------- pages ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 34px 32px 60px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.page-head h1 { font-size: 34px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.page-head p { color: var(--muted); font-size: 16px; margin-top: 6px; }
.panel { background: var(--panel); border-radius: 10px; padding: 20px; }
.panel h2 { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.play-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
.play-card { display: flex; flex-direction: column; gap: 14px; }
.play-card p { color: var(--muted); }
.play-card .btn.big { width: 100%; }
.codebox { position: relative; display: flex; gap: 8px; cursor: text; border-radius: 10px; }
.codebox:focus-within .tile.next { box-shadow: inset 0 0 0 2px var(--green); }
.tile {
  flex: 1; height: 60px; border-radius: 8px; background: var(--panel-2); display: grid; place-items: center;
  font-size: 28px; font-weight: 900; letter-spacing: .02em; box-shadow: inset 0 0 0 1px var(--line);
}
.tile.full { background: var(--panel-3); }
.code-input { position: absolute; inset: 0; width: 100%; opacity: 0; border: 0; cursor: text; text-transform: uppercase; font-size: 16px; }
.join-row { display: flex; gap: 10px; }
.join-row .btn { flex: 1; }
.err { color: var(--red-text); font-size: 14px; min-height: 20px; }
.notice { padding: 12px 16px; border-radius: 8px; background: rgba(224, 81, 60, .14); color: var(--ink); margin-bottom: 18px; }

.tables { display: flex; flex-direction: column; }
.trow {
  display: grid; grid-template-columns: minmax(0, 1.6fr) 1fr 0.8fr 0.8fr auto; align-items: center; gap: 14px;
  padding: 12px 12px; border-radius: 8px; background: none; border: 0; text-align: left; width: 100%; color: inherit;
}
.trow:hover { background: var(--panel-2); }
.trow + .trow { border-top: 1px solid var(--line); }
.trow .nm { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .nm small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: .06em; }
.trow .faces { display: flex; }
.trow .faces .avatar { margin-right: -6px; box-shadow: 0 0 0 2px var(--panel); }
.trow .meta { color: var(--muted); font-weight: 600; }
.trow .meta b { color: var(--ink); }
.thead { display: grid; grid-template-columns: minmax(0, 1.6fr) 1fr 0.8fr 0.8fr auto; gap: 14px; padding: 0 12px 8px; color: var(--dim); font-size: 13px; font-weight: 700; }
.empty { color: var(--muted); padding: 22px 12px; text-align: center; }
.livedot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }

.lb { width: 100%; border-collapse: collapse; }
.lb th { text-align: right; color: var(--dim); font-size: 13px; font-weight: 700; padding: 0 10px 10px; }
.lb th:nth-child(1), .lb th:nth-child(2) { text-align: left; }
.lb td { padding: 10px; text-align: right; border-top: 1px solid var(--line); font-weight: 600; }
.lb td.rank { text-align: left; width: 44px; color: var(--muted); font-weight: 800; }
.lb td.who { text-align: left; }
.lb td.who > div { display: flex; align-items: center; gap: 10px; font-weight: 800; min-width: 0; }
.lb td.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb td.rt { font-weight: 900; font-size: 16px; }
.lb tr.me td { background: rgba(129, 182, 76, .09); }
.lb tr.me td.who .nm::after { content: " (you)"; color: var(--muted); font-weight: 600; }
.lb td.rank.medal-1 { color: #f2c94c; } .lb td.rank.medal-2 { color: #cfd4d9; } .lb td.rank.medal-3 { color: #d49a5b; }
.lb.compact td { padding: 8px 6px; }
.lb.compact th { padding: 0 6px 8px; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; width: fit-content; }
.tabs button { border: 0; background: none; color: var(--muted); font-weight: 800; padding: 7px 14px; border-radius: 6px; }
.tabs button.on { background: var(--panel-3); color: var(--ink); }
.lb-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.foot-note { color: var(--muted); font-size: 14px; margin-top: 14px; }

/* ---------- table view ---------- */
.tview { display: flex; height: 100%; }
.tcenter { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex: none; }
.tbar .ttl { flex: 1; min-width: 0; }
.tbar .ttl b { display: block; font-size: 18px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbar .ttl span { color: var(--muted); font-size: 14px; font-weight: 600; }
.code-chip { display: flex; gap: 3px; background: none; border: 0; padding: 4px; border-radius: 6px; }
.code-chip i { font-style: normal; width: 24px; height: 30px; border-radius: 4px; background: var(--panel-2); display: grid; place-items: center; font-weight: 900; font-size: 15px; }
.code-chip:hover i { background: var(--panel-3); }
.icon-btn { width: 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 44px 90px 30px; }
.felt {
  position: relative; border-radius: 999px;
  background:
    radial-gradient(ellipse 60% 50% at 50% 45%, var(--felt-hi), var(--felt) 60%, var(--felt-lo) 100%);
  box-shadow:
    0 0 0 12px var(--rail),
    0 0 0 13px rgba(255,255,255,.06),
    0 30px 60px rgba(0,0,0,.5),
    inset 0 0 0 2px rgba(255,255,255,.05),
    inset 0 0 60px rgba(0,0,0,.35);
}
.felt::before {
  content: ""; position: absolute; inset: 7%; border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,.07); pointer-events: none;
}
.felt-layer, .fx-layer { position: absolute; inset: 0; }
.fx-layer { pointer-events: none; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px; width: 92%; }
.board { display: flex; gap: 6px; justify-content: center; }
.board .card { --cw: clamp(40px, 4.4vw, 64px); }
.felt.tall .board .card { --cw: clamp(32px, 9.2vw, 54px); }
.pot { font-weight: 800; font-size: 16px; padding: 4px 14px; border-radius: 999px; background: rgba(0,0,0,.32); color: #fff; }
.pot.hidden { visibility: hidden; }
.result { color: #fff; text-align: center; font-size: 16px; line-height: 1.35; min-height: 2.7em; max-width: 34ch; }
.result strong { font-weight: 900; }
.result em { display: block; font-style: normal; color: rgba(255,255,255,.72); font-weight: 600; }
.felt-mark { color: rgba(255,255,255,.12); font-size: 30px; font-weight: 900; letter-spacing: -.02em; }

.card {
  --cw: 44px; position: relative; flex: none;
  width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1);
  background: var(--card); color: var(--card-ink); padding: 0;
  box-shadow: 0 1px 0 rgba(0,0,0,.3), 0 3px 8px rgba(0,0,0,.3);
  font-weight: 900; user-select: none;
}
.card.red { color: var(--card-red); }
.card b { position: absolute; left: 8%; top: 3%; font-size: calc(var(--cw) * .46); line-height: 1; letter-spacing: -.05em; }
.card i { position: absolute; right: 8%; bottom: 5%; font-style: normal; font-family: system-ui, sans-serif; font-size: calc(var(--cw) * .52); line-height: 1; }
.card.back {
  background-color: var(--back);
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.09) 0 2px, transparent 2px 7px), repeating-linear-gradient(-45deg, rgba(255,255,255,.09) 0 2px, transparent 2px 7px);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 2px 5px rgba(0,0,0,.4);
}
.card.slot { background: rgba(0,0,0,.12); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.1); }
.card.deal { animation: deal .4s cubic-bezier(.2,.8,.25,1) both; }
@keyframes deal { from { transform: perspective(500px) rotateY(80deg) translateY(-6px); opacity: .2; } to { transform: none; opacity: 1; } }
.card.dim { opacity: .38; }

.seat { position: absolute; transform: translate(-50%, -50%); width: 150px; z-index: 2; }
.seat .cards { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% - 10px); display: flex; gap: 3px; z-index: -1; }
.seat.top .cards { bottom: auto; top: calc(100% - 10px); }
.seat .cards .card { --cw: 30px; }
.seat.show .cards .card { --cw: 38px; }
.plate {
  position: relative; display: flex; align-items: center; gap: 8px;
  background: #1d1c19; border-radius: 9px; padding: 6px 8px;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 6px 14px rgba(0,0,0,.45);
}
.plate .who { min-width: 0; flex: 1; }
.plate .nm { display: flex; align-items: baseline; gap: 5px; font-weight: 800; font-size: 14px; line-height: 1.2; }
.plate .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate .nm small { color: var(--muted); font-weight: 700; font-size: 12px; flex: none; }
.plate .st { font-weight: 900; font-size: 15px; line-height: 1.2; }
.plate .st.note { color: var(--muted); font-weight: 700; font-size: 13px; }
.plate .dot { position: absolute; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: #55534f; }
.plate .dot.on { background: var(--green); }
.plate .dbtn {
  position: absolute; left: -9px; top: -9px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; color: #111; font-weight: 900; font-size: 12px; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.plate .delta { font-size: 12px; font-weight: 800; margin-left: 2px; }
.seat.turn .plate { box-shadow: 0 0 0 2px var(--green), 0 0 22px rgba(129,182,76,.55); }
.seat.folded .plate, .seat.idle .plate { opacity: .5; }
.seat.winner .plate { box-shadow: 0 0 0 2px #f2c94c, 0 0 22px rgba(242,201,76,.45); }
.timer { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 3px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.1); }
.timer i, .mytimer i { display: block; height: 100%; background: var(--green); transform-origin: left; animation: drain linear forwards; }
.timer.late i, .mytimer.late i { background: var(--red); }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.empty-seat {
  position: absolute; transform: translate(-50%, -50%); width: 96px; height: 40px; border-radius: 9px;
  border: 1.5px dashed rgba(255,255,255,.18); background: rgba(0,0,0,.08); color: rgba(255,255,255,.75);
  font-weight: 800; font-size: 14px; z-index: 1;
}
.empty-seat:hover:not(:disabled) { border-color: var(--green-hi); background: rgba(129,182,76,.16); color: #fff; }
.empty-seat:disabled { color: transparent; border-color: rgba(255,255,255,.08); background: transparent; }
.bet { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px; color: #fff; font-weight: 800; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; z-index: 1; }
.bet.note { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.85); }
.chip { width: 17px; height: 17px; border-radius: 50%; flex: none; background: repeating-conic-gradient(var(--chip, #eee) 0 30deg, rgba(255,255,255,.9) 30deg 45deg); box-shadow: inset 0 0 0 3px var(--chip, #eee), 0 1px 2px rgba(0,0,0,.6); }
.float { position: absolute; transform: translate(-50%, -50%); font-size: 32px; animation: floatup 2.2s ease-out forwards; z-index: 5; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
.status { text-align: center; color: var(--muted); font-weight: 600; min-height: 22px; margin: 0 0 10px; flex: none; }
.status strong { color: var(--ink); font-weight: 800; }

.dock { flex: none; padding: 14px 20px 18px; border-top: 1px solid var(--line); background: var(--nav); }
.dock-inner { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 22px; min-height: 86px; }
.mine { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.mine .hand { display: flex; gap: 5px; }
.mine .hand .card { --cw: 52px; }
.mine .info { min-width: 0; }
.mine .info strong { display: block; font-size: 18px; font-weight: 900; line-height: 1.2; }
.mine .info span { display: block; color: var(--muted); font-weight: 600; }
.mine .stack { margin-left: auto; text-align: right; padding-right: 6px; }
.mine .stack strong { display: block; font-size: 24px; font-weight: 900; line-height: 1.1; }
.mine .stack span { color: var(--muted); font-size: 13px; font-weight: 700; }
.ctrl { display: flex; flex-direction: column; gap: 8px; flex: none; width: 470px; }
.acts { display: flex; gap: 10px; }
.acts .btn { flex: 1; min-height: 52px; font-size: 17px; }
.mytimer { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
.raise { display: flex; flex-direction: column; gap: 8px; }
.presets { display: flex; gap: 6px; }
.presets .btn { flex: 1; }
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--green); height: 28px; }
.wait { color: var(--muted); font-weight: 600; }
.react-row { display: flex; gap: 2px; }
.react-row button { width: 34px; height: 32px; border-radius: 6px; border: 0; background: transparent; font-size: 18px; }
.react-row button:hover { background: var(--panel-2); }

.side { width: var(--side-w); flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--nav); min-height: 0; }
.side .panel { padding: 14px; }
.side .panel.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.side h3 { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
.side .tabs { margin-bottom: 10px; width: 100%; }
.side .tabs button { flex: 1; }
.standings { width: 100%; border-collapse: collapse; }
.standings td { padding: 6px 4px; font-weight: 700; border-top: 1px solid var(--line); }
.standings tr:first-child td { border-top: 0; }
.standings td.who { max-width: 0; width: 100%; }
.standings td.who div { display: flex; align-items: center; gap: 8px; }
.standings td.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.standings td.num { text-align: right; white-space: nowrap; padding-left: 10px; }
.standings td.rt { color: var(--muted); }
.standings tr.me td { color: var(--ink); }
.standings tr.gone td { opacity: .5; }

/* ---------- dialogs & toasts ---------- */
dialog { border: 0; padding: 0; background: var(--panel); color: var(--ink); width: min(100% - 24px, 460px); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6); max-height: 88vh; }

<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* 200 Club — No-Limit Hold'em engine. Pure functions over a plain-JSON table object.

(function (root) {
  'use strict';

  var RANKS = '23456789TJQKA';
  var SUITS = 'shdc';

  for (var i = 0; i < 13; i++) RV[RANKS[i]] = i + 2;
  var WORD = { 2: 'two', 3: 'three', 4: 'four', 5: 'five', 6: 'six', 7: 'seven', 8: 'eight', 9: 'nine', 10: 'ten', 11: 'jack', 12: 'queen', 13: 'king', 14: 'ace' };

  function freshDeck() {

  function rank5(c) {

    rs.sort(function (a, b) { return b - a; });
    var flush = ss[0] === ss[1] && ss[0] === ss[2] && ss[0] === ss[3] && ss[0] === ss[4];

    var groups = Object.keys(cnt).map(function (r) { return [+r, cnt[r]]; })

    if (straightHigh && flush) { cat = 8; tb = [straightHigh]; }

    else if (straightHigh) { cat = 4; tb = [straightHigh]; }
    else if (groups[0][1] === 3) { cat = 3; tb = groups.map(function (g) { return g[0]; }); }
    else if (groups[0][1] === 2 && groups[1][1] === 2) { cat = 2; tb = [groups[0][0], groups[1][0], groups[2][0]]; }
    else if (groups[0][1] === 2) { cat = 1; tb = groups.map(function (g) { return g[0]; }); }

    for (k = 0; k < 5; k++) score = score * 15 + (tb[k] || 0);

      case 4: return 'Straight, ' + WORD[a] + ' high';

    var rs = cards.map(function (c) { return RV[c[0]]; }).sort(function (x, y) { return y - x; });

    var g = Object.keys(cnt).map(function (r) { return [+r, cnt[r]]; }).sort(function (x, y) { return y[1] - x[1] || y[0] - x[0]; });

  }

  /* ---------------- table helpers ---------------- */
  function ledgerOf(T, pid) {
    if (!T.ledger) T.ledger = {};

  function seated(T) {

  function eligible(T) {

    });
  }
  function potTotal(H) {
    var s = 0;
    for (var pid in H.p) s += H.p[pid].total;
    return s;
  }
  function newTable(o) {
    return {
      code: o.code, name: o.name || 'Poker night', host: o.host, priv: !!o.priv,
      createdAt: o.now,
      cfg: { sb: o.sb || 1, bb: o.bb || 2, buyIn: o.buyIn || 200, timer: o.timer || 30, max: o.max || 8 },
      pend: null, paused: false, season: o.season || 'base',
      v: 0, t: o.now, dealer: null,

  }
  function startHand(T, now, randInt) {
    if (T.pend) {

    if (order.length < 2) return false;
    var n = order.length;
    var bi = -1;
    for (var i = 0; i < n; i++) if (T.players[order[i]].seat > T.button) { bi = i; break; }

    T.button = T.players[order[bi]].seat;

    var bbI = n === 2 ? (bi + 1) % n : (bi + 2) % n;
    var deck = shuffle(freshDeck(), randInt);
    var p = {};

    var H = {
      no: T.handNo + 1, order: order, btn: bi, sb: order[sbI], bb: order[bbI],
      deck: deck, board: [], p: p, street: 0, cur: T.cfg.bb, minR: T.cfg.bb,
      seq: 0, toAct: null, turnAt: now, runout: false, runoutAt: 0, reveal: false,
      done: false, result: null, startedAt: now, doneAt: 0
    };

    T.hand = H;
    order.forEach(function (pid) { ledgerOf(T, pid).h += 1; });
    pay(T, H, H.sb, T.cfg.sb); p[H.sb].last = { a: 'sb', amt: p[H.sb].bet };
    pay(T, H, H.bb, T.cfg.bb); p[H.bb].last = { a: 'bb', amt: p[H.bb].bet };

  }
  /* Decide what happens next after any change: next player, next street, or end of hand. */
  function progress(T, now, fromIdx, inclusive) {
    var H = T.hand;
    var alive = H.order.filter(function (pid) { return !H.p[pid].folded; });
    if (alive.length <= 1) { finishUncontested(T, alive[0], now); return; }
    var actors = alive.filter(function (pid) { return !H.p[pid].allIn; });

    H.street += 1;
    var k = H.street === 1 ? 3 : 1;
    for (var i = 0; i < k; i++) H.board.push(H.deck.pop());

  function endStreet(T, now) {
    var H = T.hand;

    contrib.forEach(function (c) { if (c.live && levels.indexOf(c.amt) < 0) levels.push(c.amt); });

    contrib.forEach(function (c) { extra += Math.max(0, c.amt - prev); });

  }
  function fromButton(H, pids) {
    var n = H.order.length;
    return pids.slice().sort(function (a, b) {

      var ib = (H.order.indexOf(b) - H.btn - 1 + n) % n;
